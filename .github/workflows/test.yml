name: 引擎自動測試

# 每次更新、加上每週一次，用真的 Whisper 和講者模型把「上傳 → 轉錄 → 分辨講者」完整跑一遍。
# 通過才會更新 stable 分支；Colab 筆記本只使用 stable，所以沒通過測試的改動不會到使用者手上。
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"   # 每週一 10:17（臺灣時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 建立固定版本的執行環境（與 Colab 相同）
        run: |
          python3 -m pip install -q uv==0.11.32
          uv venv -p 3.11 .venv
          uv pip install --python .venv -r engine/requirements.lock

      - name: 安裝 AI 校對模組（CPU 版，從原始碼編譯同一版本 llama.cpp）
        run: |
          CMAKE_ARGS="-DGGML_NATIVE=OFF -DLLAMA_CURL=OFF" uv pip install --python .venv --no-binary llama-cpp-python llama-cpp-python==0.3.19 diskcache==5.6.3 jinja2==3.1.6 MarkupSafe==3.0.3

      - name: 確認 Colab 用的 GPU 版下載連結仍然有效
        run: |
          URL=$(.venv/bin/python -c "import sys; sys.path.insert(0,'engine'); import proofread; print(proofread.LLM_WHEEL)")
          curl -sfIL -o /dev/null "$URL" && echo "OK $URL"

      - name: 產生三人對話測試錄音
        run: |
          mkdir -p ci-log
          .venv/bin/python tests/make_dialog.py /tmp/t 2>&1 | tee ci-log/make_dialog.txt

      - name: 端對端測試（上傳、轉錄、講者分辨）
        run: |
          set -o pipefail
          VERBATIM_TEST_PROOF=1 VERBATIM_LLM_NO_INSTALL=1 \
          VERBATIM_LLM_REPO=Qwen/Qwen3-0.6B-GGUF VERBATIM_LLM_FILE=Qwen3-0.6B-Q8_0.gguf \
          .venv/bin/python tests/e2e.py /tmp/t/dialog.mp3 /tmp/t/dialog_truth.json small 2>&1 | tee ci-log/e2e.txt

      - name: 保存測試紀錄到 ci-logs 分支（方便沒有登入也能查看）
        if: always()
        run: |
          cd ci-log && git init -q && git checkout -q -b ci-logs
          echo "${{ github.sha }} ${{ job.status }} $(date -u +%FT%TZ)" > RESULT.txt
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs


  publish:
    name: 測試通過，發佈到 stable
    needs: [e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/stable --force
