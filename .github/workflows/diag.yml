name: 模型檔診斷
on:
  push:
    branches: [diag]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q onnx huggingface_hub
      - name: 檢查 Breeze ONNX 的外部資料設定
        run: |
          mkdir -p out
          python tools/inspect_onnx.py > out/report.txt 2>&1 || true
          cat out/report.txt
      - name: 保存結果
        if: always()
        run: |
          cd out && git init -q && git checkout -q -b ci-logs-diag && git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm diag
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs-diag
