name: 引擎自動測試

# 每次更新、加上每週一次，用真的 Whisper 和講者模型把「上傳 → 轉錄 → 分辨講者」完整跑一遍。
# Linux（同 Colab 環境）、Windows、Mac 三個平台都通過才會更新 stable 分支；
# Colab 筆記本和本機安裝程式只使用 stable，所以沒通過測試的改動不會到使用者手上。
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"   # 每週一 10:17（臺灣時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 建立固定版本的執行環境（與 Colab 相同）
        run: |
          python3 -m pip install -q uv==0.11.32
          uv venv -p 3.11 .venv
          uv pip install --python .venv -r engine/requirements.lock

      - name: 安裝 AI 校對模組（CPU 版，從原始碼編譯同一版本 llama.cpp）
        run: |
          CMAKE_ARGS="-DGGML_NATIVE=OFF -DLLAMA_CURL=OFF" uv pip install --python .venv --no-binary llama-cpp-python llama-cpp-python==0.3.19 diskcache==5.6.3 jinja2==3.1.6 MarkupSafe==3.0.3

      - name: 確認 Colab 用的 GPU 版下載連結仍然有效
        run: |
          URL=$(.venv/bin/python -c "import sys; sys.path.insert(0,'engine'); import proofread; print(proofread.LLM_WHEEL)")
          curl -sfIL -o /dev/null "$URL" && echo "OK $URL"

      - name: 產生三人對話測試錄音
        run: |
          mkdir -p ci-log
          .venv/bin/python tests/make_dialog.py /tmp/t 2>&1 | tee ci-log/make_dialog.txt

      - name: 端對端測試（上傳、轉錄、講者分辨）
        run: |
          set -o pipefail
          VERBATIM_TEST_PROOF=1 VERBATIM_LLM_NO_INSTALL=1 \
          VERBATIM_LLM_REPO=Qwen/Qwen3-0.6B-GGUF VERBATIM_LLM_FILE=Qwen3-0.6B-Q8_0.gguf \
          .venv/bin/python tests/e2e.py /tmp/t/dialog.mp3 /tmp/t/dialog_truth.json small 2>&1 | tee ci-log/e2e.txt

      - name: 保存測試紀錄到 ci-logs 分支（方便沒有登入也能查看）
        if: always()
        run: |
          cd ci-log && git init -q && git checkout -q -b ci-logs
          echo "${{ github.sha }} ${{ job.status }} $(date -u +%FT%TZ)" > RESULT.txt
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs


  local:
    name: 本機安裝（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      VERBATIM_ENGINE_SRC: ${{ github.workspace }}/engine
      VERBATIM_LAUNCH_SRC: ${{ github.workspace }}/local/launch.py
    steps:
      - uses: actions/checkout@v4

      - name: 執行安裝程式（Windows：install.bat）
        if: runner.os == 'Windows'
        shell: cmd
        run: call local\install.bat --no-browser

      - name: 執行安裝程式（Mac：install.sh）
        if: runner.os == 'macOS'
        run: sh local/install.sh --no-browser

      - name: 確認引擎在背景待命、只聽本機、已設定開機啟動
        shell: bash
        run: |
          curl -sf http://localhost:8765/api/system | tee /tmp/sys.json
          grep -q '"local":true' /tmp/sys.json
          if [ "$RUNNER_OS" = "Windows" ]; then
            reg query "HKCU\Software\Microsoft\Windows\CurrentVersion\Run" /v VerbatimEngine
          else
            test -f "$HOME/Library/LaunchAgents/io.github.verbatim.engine.plist"
          fi
          curl -sf -X OPTIONS http://localhost:8765/api/system -H "Origin: https://bevis0414-crypto.github.io" \
            -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Private-Network: true" -D - -o /dev/null \
            | grep -i "access-control-allow-private-network: true"

      - name: 端對端測試（轉錄、講者分辨、AI 校對，用安裝好的環境）
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ROOT="$LOCALAPPDATA/Verbatim"; PY="$ROOT/venv/Scripts/python.exe"; export VERBATIM_UV="$ROOT/uv/uv.exe"
          else
            ROOT="$HOME/Library/Application Support/Verbatim"; PY="$ROOT/venv/bin/python"; export VERBATIM_UV="$ROOT/uv/uv"
          fi
          mkdir -p ci-log
          "$PY" tests/make_dialog.py "$RUNNER_TEMP/t" 2>&1 | tee ci-log/make_dialog.txt
          set -o pipefail
          PYTHONIOENCODING=utf-8 VERBATIM_TEST_PROOF=1 VERBATIM_LLM_REPO=Qwen/Qwen3-0.6B-GGUF VERBATIM_LLM_FILE=Qwen3-0.6B-Q8_0.gguf \
            "$PY" tests/e2e.py "$RUNNER_TEMP/t/dialog.mp3" "$RUNNER_TEMP/t/dialog_truth.json" small 2>&1 | tee ci-log/e2e.txt

      - name: 移除，確認清乾淨
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ROOT="$LOCALAPPDATA/Verbatim"; UV="$ROOT/uv/uv.exe"; else ROOT="$HOME/Library/Application Support/Verbatim"; UV="$ROOT/uv/uv"; fi
          cp "$UV" "$RUNNER_TEMP/" && UV="$RUNNER_TEMP/$(basename "$UV")"
          PYTHONIOENCODING=utf-8 "$UV" run --no-project --python 3.11 local/launch.py --uninstall
          sleep 3
          ! curl -sf -m 3 http://localhost:8765/api/system
          test ! -d "$ROOT"

      - name: 保存測試紀錄到 ci-logs 分支
        if: always()
        shell: bash
        run: |
          mkdir -p ci-log && cd ci-log && git init -q && git checkout -q -b "ci-logs-${{ runner.os }}"
          echo "${{ github.sha }} ${{ job.status }} $(date -u +%FT%TZ)" > RESULT.txt
          git add -A && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "log ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "ci-logs-${{ runner.os }}"

  publish:
    name: 三個平台都通過，發佈到 stable
    needs: [e2e, local]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:refs/heads/stable --force
